[package]
name = "workout-board"
version = "0.1.0"
description = "Local-first workout dashboard for macOS"
authors = ["Workout Board contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/kissy24/workout-board"

[lib]
name = "workout_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
